<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário de TI | Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Topbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-lg text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">Inventário de TI</h1>
          <p class="text-xs text-slate-500">Gestão e controle de equipamentos</p>
        </div>
      </div>
      <button id="btn-novo" class="inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-all">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Novo Equipamento
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <!-- Cards de Resumo (Métricas em Tempo Real) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">Total de Itens</p>
          <p id="stat-total" class="text-2xl font-bold text-slate-900 mt-1">0</p>
        </div>
        <div class="p-3 bg-slate-100 rounded-lg text-slate-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-emerald-600 uppercase tracking-wider">Disponíveis</p>
          <p id="stat-disponivel" class="text-2xl font-bold text-emerald-700 mt-1">0</p>
        </div>
        <div class="p-3 bg-emerald-50 rounded-lg text-emerald-600">
          <span class="inline-block w-4 h-4 rounded-full bg-emerald-500"></span>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-amber-600 uppercase tracking-wider">Em Uso</p>
          <p id="stat-em-uso" class="text-2xl font-bold text-amber-700 mt-1">0</p>
        </div>
        <div class="p-3 bg-amber-50 rounded-lg text-amber-600">
          <span class="inline-block w-4 h-4 rounded-full bg-amber-500"></span>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-rose-600 uppercase tracking-wider">Em Manutenção</p>
          <p id="stat-manutencao" class="text-2xl font-bold text-rose-700 mt-1">0</p>
        </div>
        <div class="p-3 bg-rose-50 rounded-lg text-rose-600">
          <span class="inline-block w-4 h-4 rounded-full bg-rose-500"></span>
        </div>
      </div>
    </div>

    <!-- Barra de Filtros e Busca (BÔNUS) -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="w-full md:w-1/3 relative">
        <input 
          type="text" 
          id="filter-search" 
          placeholder="Buscar por nome do equipamento..." 
          class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
        >
        <svg class="w-5 h-5 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <div class="flex flex-wrap w-full md:w-auto gap-3">
        <select id="filter-categoria" class="py-2 px-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="">Todas as Categorias</option>
          <option value="Computador">Computador</option>
          <option value="Periférico">Periférico</option>
          <option value="Rede">Rede</option>
          <option value="Outros">Outros</option>
        </select>

        <select id="filter-status" class="py-2 px-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="">Todos os Status</option>
          <option value="Disponível">Disponível</option>
          <option value="Em uso">Em uso</option>
          <option value="Em manutenção">Em manutenção</option>
        </select>

        <button id="btn-limpar" class="py-2 px-3 text-slate-600 hover:text-slate-900 text-sm font-medium border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
          Limpar
        </button>
      </div>
    </div>

    <!-- Tabela de Listagem -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-200 text-left text-sm">
          <thead class="bg-slate-50 text-slate-600 font-semibold">
            <tr>
              <th class="px-6 py-3.5">Equipamento</th>
              <th class="px-6 py-3.5">Categoria</th>
              <th class="px-6 py-3.5">Qtd</th>
              <th class="px-6 py-3.5">Status</th>
              <th class="px-6 py-3.5 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="equipamentos-table-body" class="divide-y divide-slate-100">
            <!-- Linhas preenchidas via JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Estado Vazio (quando não houver dados) -->
      <div id="empty-state" class="hidden py-12 text-center">
        <svg class="w-12 h-12 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
        </svg>
        <p class="text-slate-500 font-medium">Nenhum equipamento encontrado.</p>
        <p class="text-xs text-slate-400 mt-1">Tente ajustar seus filtros ou cadastrar um novo item.</p>
      </div>
    </div>
  </main>

  <!-- Modal de Cadastro / Edição -->
  <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden transition-all transform">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modal-title" class="text-lg font-bold text-slate-900">Novo Equipamento</h3>
        <button id="btn-fechar-modal" class="text-slate-400 hover:text-slate-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="form-equipamento" class="p-6 space-y-4">
        <input type="hidden" id="equipamento-id">

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nome do Equipamento *</label>
          <input type="text" id="input-nome" required placeholder="Ex.: Notebook Dell Inspiron 15" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Quantidade *</label>
            <input type="number" id="input-quantidade" required min="0" value="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Categoria *</label>
            <select id="input-categoria" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="Computador">Computador</option>
              <option value="Periférico">Periférico</option>
              <option value="Rede">Rede</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Status *</label>
          <select id="input-status" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Disponível">Disponível</option>
            <option value="Em uso">Em uso</option>
            <option value="Em manutenção">Em manutenção</option>
          </select>
        </div>

        <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
          <button type="button" id="btn-cancelar" class="px-4 py-2 text-slate-600 hover:text-slate-800 text-sm font-medium">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow-sm transition-all">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
